name: Build Tanks (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build Release (capture logs)
        run: |
          powershell -Command "Set-Location build; cmake --build . --config Release --target Tanks 2>&1 | Tee-Object -FilePath build_log.txt; exit $LastExitCode"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tanks-windows-logs
          path: build/build_log.txt

      - name: Upload Tanks.exe artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tanks-windows
          path: build/**/Tanks.exe
