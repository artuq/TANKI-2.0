name: Build Tanks (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..

      - name: Build Release
        run: cmake --build build --config Release --target Tanks

      - name: Upload Tanks.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanks-windows
          path: build/**/Tanks.exe
